<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication — Meeting Room System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">  
    <link rel="stylesheet" href="css/style.css">
    <script src="js/auth.js" defer></script>
</head>
<body class="d-flex flex-column min-vh-screen bg-light">

    <header class="custom-header p-3 text-white shadow-sm">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="h4 mb-0 fw-bold">🌿 Meeting Room Booking System</h1>
            <span class="badge bg-white text-dark px-3 py-2">v1.0 (MVP)</span>
        </div>
    </header>

    <main class="flex-grow-1 d-flex align-items-center justify-content-center w-100 px-3 main-auth-container">
        <div class="card shadow border-0 p-4 auth-card">
            <div class="card-body">
                <h2 id="form-title" class="card-title h4 text-center mb-4 fw-bold text-olive">Sign In</h2>
                
                <form id="auth-form">
                    <div class="mb-3">
                        <label for="name" class="form-label text-secondary small fw-medium">Username</label>
                        <input type="text" id="name" required class="form-control form-control-lg fs-6" placeholder="Enter your username">
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label text-secondary small fw-medium">Password</label>
                        <input type="password" id="password" required class="form-control form-control-lg fs-6" placeholder="Enter your password">
                    </div>
                    
                    <div id="admin-block" class="form-check mb-4 d-none bg-light p-3 rounded border">
                        <input type="checkbox" id="isAdmin" class="form-check-input ms-0 me-2" style="cursor: pointer;">
                        <label for="isAdmin" class="form-check-label small text-dark fw-semibold" style="cursor: pointer;">I am an Administrator</label>
                    </div>
                    
                    <button type="submit" id="submit-btn" class="btn btn-success btn-lg w-100 fw-bold shadow-sm btn-olive">
                        Sign In
                    </button>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <button id="toggle-mode-btn" class="btn btn-link text-decoration-none small fw-semibold text-olive">
                        Don't have an account? Sign Up
                    </button>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white-50 text-center py-3 border-top border-secondary custom-footer">
        <div class="container small">
            &copy; 2026 Meeting Room Booking System.
        </div>
    </footer>

</body>
</html>
