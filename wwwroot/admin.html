<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel — Add Room & Slots</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">    <link rel="stylesheet" href="css/style.css">
    <script src="js/admin.js" defer></script>
</head>
<body class="d-flex flex-column min-vh-screen bg-light">

    <header class="custom-header p-3 text-white shadow-sm">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="h4 mb-0 fw-bold">🌿 Meeting Room Booking System</h1>
            <div class="d-flex align-items-center gap-3">
                <span id="admin-greeting" class="badge bg-white text-dark px-3 py-2 fs-6 fw-semibold">Welcome, Admin</span>
                <button id="logout-btn" class="btn btn-outline-light btn-sm fw-bold px-3 py-1">Sign Out</button>
            </div>
        </div>
    </header>

    <main class="flex-grow-1 d-flex align-items-center justify-content-center w-100 px-3 main-auth-container">
        <div class="card shadow border-0 p-4 auth-card">
            <div class="card-body">
                <h2 class="card-title h4 text-center mb-4 fw-bold text-olive">Create Room with Schedule</h2>
                
                <form id="room-master-form">
                    <!-- Room Title -->
                    <div class="mb-3">
                        <label for="room-title" class="form-label text-secondary small fw-medium">Room Title</label>
                        <input type="text" id="room-title" required class="form-control form-control-lg fs-6" placeholder="Enter room title">
                    </div>
                    
                    <div class="mb-3">
                        <label for="room-number" class="form-label text-secondary small fw-medium">Room number</label>
                        <input type="text" id="room-number" required class="form-control form-control-lg fs-6" placeholder="Enter room number (e.g., 101-A)">
                    </div>

                    <div class="mb-4">
                        <label for="room-capacity" class="form-label text-secondary small fw-medium">Max Capacity (People)</label>
                        <input type="number" id="room-capacity" required class="form-control form-control-lg fs-6" placeholder="Enter maximal amount of people" min="1">
                    </div>

                    <div class="border rounded p-3 bg-white mb-4 shadow-sm">
                        <h4 class="h6 fw-bold text-dark mb-3">📅 Configure Hourly Slots</h4>
                        
                        <div class="mb-3">
                            <label for="slot-date" class="form-label text-secondary small fw-medium">Select Target Date</label>
                            <input type="date" id="slot-date" class="form-control">
                        </div>

                        <label class="form-label text-secondary small fw-medium mb-2">Click to select hours (60 min each):</label>
                        <div id="hours-grid" class="row g-2 mb-3"></div>

                        <button type="button" id="add-date-list-btn" class="btn btn-sm btn-outline-success w-100 fw-bold">
                            + Add This Date to Batch List
                        </button>
                    </div>

                    <div id="batch-preview-container" class="mb-4 d-none">
                        <label class="form-label text-secondary small fw-semibold">Configured Dates Batch Queue:</label>
                        <ul id="batch-list" class="list-group list-group-flush border rounded bg-light"></ul>
                    </div>
                    
                    <button type="submit" class="btn btn-success btn-lg w-100 fw-bold shadow-sm btn-olive">
                        Publish Room & Schedule
                    </button>
                </form>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white-50 text-center py-3 border-top border-secondary custom-footer">
        <div class="container small">
            &copy; 2026 Meeting Room Booking System.
        </div>
    </footer>

</body>
</html>
